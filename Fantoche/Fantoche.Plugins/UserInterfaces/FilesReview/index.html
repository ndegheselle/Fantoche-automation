<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Files review</title>
    <link rel="stylesheet" href="files-review.css">
</head>
<body>
    <h1 id="title"></h1>
    <p class="hint">Click a file to preview it, untick the ones to leave out, then confirm.</p>
    <div class="review">
        <ul id="files"></ul>
        <iframe id="preview" title="Preview"></iframe>
    </div>
    <p id="error" role="alert" hidden></p>
    <div class="actions">
        <span id="count"></span>
        <button id="cancel" type="button">Later</button>
        <button id="confirm" type="button" class="primary">Confirm</button>
    </div>
    <script src="files-review.js"></script>
</body>
</html>
