<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Compose PDF</title>
    <link rel="stylesheet" href="compose-pdf.css">
</head>
<body>
    <h1 id="title"></h1>
    <p class="hint">
        Compose the document saved for each table, previewed on the first one. Texts can hold
        <code>{index}</code>, <code>{count}</code> and <code>{rows}</code>.
    </p>

    <div class="composer">
        <section class="editor">
            <label class="option"><input id="landscape" type="checkbox"> Landscape</label>
            <ol id="blocks"></ol>
            <div class="add">
                <button type="button" data-kind="Heading">+ Heading</button>
                <button type="button" data-kind="Text">+ Text</button>
                <button type="button" data-kind="Table">+ Table</button>
            </div>
        </section>
        <section class="preview">
            <div id="page" class="page"></div>
        </section>
    </div>

    <p id="error" role="alert" hidden></p>
    <div class="actions">
        <span id="summary"></span>
        <button id="cancel" type="button">Later</button>
        <button id="confirm" type="button" class="primary">Confirm</button>
    </div>
    <script src="compose-pdf.js"></script>
</body>
</html>
