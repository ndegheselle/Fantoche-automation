<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Table review</title>
    <link rel="stylesheet" href="table-review.css">
</head>
<body>
    <h1 id="title"></h1>
    <p class="hint">Check the rows, then confirm to carry on with this table.</p>
    <div class="scroll">
        <table>
            <thead><tr id="columns"></tr></thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
    <div class="pager">
        <button id="previous" type="button">Previous</button>
        <span id="range"></span>
        <button id="next" type="button">Next</button>
    </div>
    <p id="error" role="alert" hidden></p>
    <div class="actions">
        <button id="cancel" type="button">Later</button>
        <button id="confirm" type="button" class="primary">Confirm</button>
    </div>
    <script src="table-review.js"></script>
</body>
</html>
