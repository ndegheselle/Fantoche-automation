<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Pick columns</title>
    <link rel="stylesheet" href="pick-columns.css">
</head>
<body>
    <main class="container-fluid">
        <hgroup>
            <h1 id="title"></h1>
            <p>Pick the column of the file each name stands for, name the other columns you need, then confirm.</p>
        </hgroup>

        <div class="mapping">
            <section>
                <h2>Names of the workflow</h2>
                <table>
                    <thead><tr><th>Name</th><th>Column of the file</th><th>First value</th></tr></thead>
                    <tbody id="expected"></tbody>
                </table>
            </section>
            <section>
                <h2>Other columns</h2>
                <table>
                    <thead><tr><th>Column of the file</th><th>Name, if it needs one</th><th>First value</th></tr></thead>
                    <tbody id="others"></tbody>
                </table>
            </section>
        </div>

        <h2>Preview</h2>
        <div class="preview">
            <table class="striped">
                <thead><tr id="columns"></tr></thead>
                <tbody id="rows"></tbody>
            </table>
        </div>

        <p id="error" role="alert" hidden></p>
        <footer class="actions">
            <small id="summary"></small>
            <button id="cancel" type="button" class="secondary">Later</button>
            <button id="confirm" type="button">Confirm</button>
        </footer>
    </main>
    <script src="pick-columns.js"></script>
</body>
</html>
