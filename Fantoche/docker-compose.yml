version: '3.4'
services:
  Fantoche.supervisor.api:
    image: ${DOCKER_REGISTRY-}automationapisupervisor
    build:
      context: .
      dockerfile: Fantoche.Supervisor.Api/Dockerfile
    environment:
      - DATA_FOLDER=/app/data
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      # The database and the packages served to the workers.
      - ./volumes/supervisor:/app/data

  Fantoche.worker.service:
    image: ${DOCKER_REGISTRY-}automationworkerservice
    depends_on:
      - Fantoche.supervisor.api
    build:
      context: .
      dockerfile: Fantoche.Worker.Service/Dockerfile
    environment:
      - SUPERVISOR_URL=http://Fantoche.supervisor.api:8080
      - WORKER_ID=DEFAULT_WORKER
      - DATA_FOLDER=/app/data
    volumes:
      # The packages extracted and the storage of its executions.
      - ./volumes/worker:/app/data
