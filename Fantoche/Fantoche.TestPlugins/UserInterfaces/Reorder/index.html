<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Reorder</title>
    <link rel="stylesheet" href="reorder.css">
</head>
<body>
    <h1 id="title"></h1>
    <p class="hint">Drag the items into the order you want, then confirm.</p>
    <ol id="items"></ol>
    <p id="error" role="alert" hidden></p>
    <div class="actions">
        <button id="cancel" type="button">Later</button>
        <button id="confirm" type="button" class="primary">Confirm</button>
    </div>
    <script src="reorder.js"></script>
</body>
</html>
