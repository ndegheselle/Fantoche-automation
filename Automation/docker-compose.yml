version: '3.4'
# NOTE: The distributed backend (Automation.Supervisor.Api + Automation.Worker.Service)
# was removed. The engine now runs in-process (see Automation.Worker). The mongo/redis
# services below are kept only as scaffolding for a future distributed supervisor/worker
# setup and are currently unused by any project in the solution.
services:
  mongo:
    restart: always
    image: mongo:8.0
    container_name: mongodb-container
    command: mongod --auth --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

# For worker communication with clients and supervisor
  redis:
    restart: always
    image: redis:latest
    ports:
      - "6379:6379"
    expose:
      - "6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--appendonly", "yes"]

volumes:
  mongodb-data:
    driver: local